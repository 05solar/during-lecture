# GitHub Pages 자동 배포 워크플로
# main 브랜치에 푸시되면 app/ 안의 Vite 프로젝트를 빌드해 app/dist 를 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions"로 설정해야 동작한다.
# (프로젝트 소스는 레포 루트가 아니라 app/ 하위에 있다.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
